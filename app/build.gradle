plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.mthtamim.phonelink'
    compileSdk 34

    defaultConfig {
        applicationId "com.mthtamim.phonelink"
        minSdk 26
        targetSdk 34
        versionCode 42
        versionName "2.20.0"
        // v2.19.1: ship ONLY arm64-v8a native libraries. The APK had been
        // bundling .so files for 4 ABIs (~99 MB of the ~114 MB APK):
        // x86/x86_64 exist only for emulators and armeabi-v7a only for old
        // 32-bit phones — Tamim's phones are arm64, so the other three sets
        // were dead weight (~73 MB). Trade-off, accepted by Tamim: this APK
        // no longer installs on emulators or 32-bit-only phones.
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.24"
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "com.google.android.material:material:1.12.0"
    implementation "androidx.biometric:biometric:1.1.0"
    implementation "com.google.zxing:core:3.5.3"
    implementation "androidx.camera:camera-core:1.3.4"
    implementation "androidx.camera:camera-camera2:1.3.4"
    implementation "androidx.camera:camera-lifecycle:1.3.4"
    implementation "androidx.camera:camera-view:1.3.4"
    implementation "androidx.camera:camera-video:1.3.4"
    implementation "androidx.lifecycle:lifecycle-service:2.7.0"
    implementation "com.google.mlkit:translate:17.0.3"
    implementation "dev.rikka.shizuku:api:13.1.5"
    implementation "dev.rikka.shizuku:provider:13.1.5"
    implementation "com.google.mlkit:text-recognition:16.0.1"
    // v2.18: MQTT client (WS4). Eclipse Paho mqttv3 1.2.5 — a single
    // dependency-free pure-Java artifact on Maven Central with a long-
    // stable API. HiveMQ's client was NOT chosen: its 1.3.x blocking /
    // async API surface differs per client type and cannot be compile-
    // verified in this environment, and it drags in Netty/RxJava
    // transitives. Paho is the safest verifiable coordinate here.
    implementation "org.eclipse.paho:org.eclipse.paho.client.mqttv3:1.2.5"
}
